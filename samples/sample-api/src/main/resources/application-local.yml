# local 프로파일: 개발자 PC의 로컬 실 인프라(Traefik TCP 경유)에 연결.
# 활성화:  --spring.profiles.active=local  (또는 SPRING_PROFILES_ACTIVE=local)
demo:
  environment: local

spring:
  datasource:
    url: jdbc:postgresql://localhost:15010/local.test.common
    username: cain
    password: eva
  jpa:
    hibernate:
      # 로컬 검증용이라 매번 스키마 생성/정리(운영에선 절대 사용 금지).
      ddl-auto: create-drop
  # 세션 케이스용 로컬 실 Redis. 비밀번호는 커밋 파일에 두지 않는다(외부화):
  #   런치 구성(.vscode/launch.json, gitignore) --spring.data.redis.password=... 또는 env REDIS_PASSWORD
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16010}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
