# local profile: connects to local developer infrastructure only.
# Secrets stay outside the repository and are imported with Spring Boot native config import.
demo:
  environment: local

spring:
  config:
    # Create this file by decrypting samples/sample-api/secrets/local.sops.yml.example with SOPS + age.
    import: optional:file:${user.home}/.mutuus/${spring.application.name}/local.yml
  datasource:
    url: jdbc:postgresql://localhost:15010/local.test.common
    username: cain
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16010}
      username: ${REDIS_USERNAME:default}
      password:
