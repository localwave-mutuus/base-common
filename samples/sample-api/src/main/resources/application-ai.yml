# ai profile: manual/background sample verification profile.
# Port policy:
#   - normal sample runtime: 8090 (application.yml)
#   - test sample runtimes: 8095-8099, default 8095
# Override with: --SAMPLE_API_TEST_PORT=8096

server:
  port: ${SAMPLE_API_TEST_PORT:8095}

demo:
  environment: ai

sample:
  ports:
    app: 8090
    test-range: 8095-8099

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16010}
      username: ${REDIS_USERNAME:default}
      password:
  jpa:
    hibernate:
      ddl-auto: validate

mutuus:
  common:
    security:
      audiences:
        - sample-api
      headers:
        enabled: true
    session:
      namespace: sample-api-ai:session
    datasource:
      enabled: true
      primary: app
      groups:
        app:
          write: { url: "jdbc:h2:mem:app-db;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE", username: sa, driver-class-name: org.h2.Driver }
        db1:
          write: { url: "jdbc:h2:mem:db1-write;DB_CLOSE_DELAY=-1", username: sa, driver-class-name: org.h2.Driver }
          read:  { url: "jdbc:h2:mem:db1-read;DB_CLOSE_DELAY=-1",  username: sa, driver-class-name: org.h2.Driver }
        db2:
          write: { url: "jdbc:h2:mem:db2-write;DB_CLOSE_DELAY=-1", username: sa, driver-class-name: org.h2.Driver }
          read:  { url: "jdbc:h2:mem:db2-read;DB_CLOSE_DELAY=-1",  username: sa, driver-class-name: org.h2.Driver }
        db3:
          write: { url: "jdbc:h2:mem:db3-write;DB_CLOSE_DELAY=-1", username: sa, driver-class-name: org.h2.Driver }
          read:  { url: "jdbc:h2:mem:db3-read;DB_CLOSE_DELAY=-1",  username: sa, driver-class-name: org.h2.Driver }
  sample:
    mock-jwt: true
