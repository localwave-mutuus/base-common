# ai 프로파일 — Claude(자동화)의 백그라운드 테스트 구동 전용.
#
# 실행 모드 분리(포트/인프라 충돌 방지):
#   - 사람(VS Code F5)      → local 프로파일, 포트 8081, 실 PostgreSQL
#   - Claude(백그라운드 테스트) → ai 프로파일,  포트 8091, 임베디드 H2 (이 파일)
# 테스트 화면(/demo)은 sample-api 에 항상 포함되고 permit-all 도 application.yml 기본값이라
# 별도 인자 없이 어느 모드로 띄워도 http://localhost:<port>/demo/index.html 가 동작한다.
#
# 실행 예) ./mvnw -pl samples/sample-api spring-boot:run -Dspring-boot.run.profiles=ai \
#            -Dspring-boot.run.arguments="--spring.data.redis.password=<REDIS_PASSWORD>"

server:
  port: 8091            # local(8081) 과 분리

demo:
  environment: ai

spring:
  data:
    redis:
      # 세션 케이스용(선택). 비밀번호는 커밋 파일에 두지 않는다(외부화) — 실행 시 주입.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16010}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      # 라이브러리 라우팅이 @Primary DataSource(app 그룹)를 제공하므로 Boot 의 임베디드 자동 ddl 이
      # 걸리지 않는다 → JPA 감사 데모용 스키마를 명시 생성.
      ddl-auto: create-drop

mutuus:
  common:
    # local 과 Redis 세션 키가 겹치지 않게 네임스페이스 분리
    session:
      namespace: sample-api-ai:session
    # 프로퍼티 기반 다중 DataSource + 읽기/쓰기 라우팅(라이브러리, opt-in) — YAML만으로.
    # app=JPA 기본(@Primary, read 생략→write 폴백). db1/db2/db3 = "3개 DB 각 read/write" 요구 실증용.
    datasource:
      enabled: true
      primary: app
      groups:
        app:
          # CASE_INSENSITIVE_IDENTIFIERS=TRUE: Hibernate(대문자 저장)·jOOQ·Spring Data JDBC(소문자 인용 식별자)가
          # 같은 board_post 테이블을 문제없이 공유하도록 식별자 대소문자 무시(3-스택 게시판 데모용).
          write: { url: "jdbc:h2:mem:app-db;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE", username: sa, driver-class-name: org.h2.Driver }
        db1:
          write: { url: "jdbc:h2:mem:db1-write;DB_CLOSE_DELAY=-1", username: sa, driver-class-name: org.h2.Driver }
          read:  { url: "jdbc:h2:mem:db1-read;DB_CLOSE_DELAY=-1",  username: sa, driver-class-name: org.h2.Driver }
        db2:
          write: { url: "jdbc:h2:mem:db2-write;DB_CLOSE_DELAY=-1", username: sa, driver-class-name: org.h2.Driver }
          read:  { url: "jdbc:h2:mem:db2-read;DB_CLOSE_DELAY=-1",  username: sa, driver-class-name: org.h2.Driver }
        db3:
          write: { url: "jdbc:h2:mem:db3-write;DB_CLOSE_DELAY=-1", username: sa, driver-class-name: org.h2.Driver }
          read:  { url: "jdbc:h2:mem:db3-read;DB_CLOSE_DELAY=-1",  username: sa, driver-class-name: org.h2.Driver }
  sample:
    # 보안 인증성공 케이스용 mock JwtDecoder 활성(자동화 검증 편의)
    mock-jwt: true
