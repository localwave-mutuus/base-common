spring:
  application:
    name: sample-api
  messages:
    # 라이브러리 번들(messages/messages) + 소비자 자체 번들(messages/sample-messages) 함께 로드.
    # 소비자 커스텀 ErrorCode(SampleErrorCode)의 메시지 키가 sample-messages 에서 해석된다.
    basename: messages/messages,messages/sample-messages
  security:
    oauth2:
      resourceserver:
        jwt:
          # 실제 인증 MSA의 JWK 엔드포인트. 샘플 실행용 placeholder(키 fetch는 lazy).
          # 통합 테스트는 이 값을 무시하고 mock JwtDecoder 빈으로 대체한다.
          jwk-set-uri: https://auth.mutuus.ai/realms/mutuus/protocol/openid-connect/certs
  data:
    redis:
      # Redis 는 세션 저장용으로만 쓴다(데모) — Redis 리포지토리 스캔을 꺼
      # JPA 리포지토리와의 store 판별 경고를 없앤다.
      repositories:
        enabled: false
  # 스키마는 Flyway(db/migration)가 소유하고, Hibernate 는 엔티티↔스키마 정합만 검증한다(운영급 기본).
  # 모든 프로파일·통합테스트가 이 기본을 상속한다(엔티티 자동 DDL 금지).
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

# Redis 클라이언트가 classpath 에 있어도(세션 케이스용), Redis 가 없는 프로파일에서
# actuator health 가 DOWN 으로 뜨지 않게 health 기여자를 끈다. 실 Redis 연결은
# application-local.yml(로컬 인프라가 있는 환경)에서만 구성한다.
management:
  health:
    redis:
      enabled: false

# 테스트/데모 화면(/demo)은 sample-api 에 항상 포함된다 — 상세 로깅으로 라이브러리 동작을 관찰.
logging:
  level:
    ai.mutuus.common: DEBUG
    ai.mutuus.common.access: DEBUG

mutuus:
  common:
    service-name: sample-api
    default-locale: ko-KR
    # 어플리케이션코드(숫자/영문 4자리). 인스턴스구분코드(6자리)는 미지정 → 구동 시 자동 생성.
    app-code: SMPL
    security:
      permit-all:
        - /demo/**          # 테스트/데모 화면(항상 포함)
        - /api/public/**
        - /actuator/**
        - /v3/api-docs/**   # OpenAPI 3.x 스펙(JSON)
        - /swagger-ui/**    # Swagger UI 정적 리소스
        - /swagger-ui.html
    logging:
      # 느린 요청 케이스가 잘 드러나도록 임계치를 낮춘다(기본 1000ms)
      slow-request-threshold-millis: 1000
      # 로그 뷰어(logs.html)가 1.5초마다 폴링하는 tail 경로는 로깅에서 제외(뷰어가 자기 폴링으로 도배 방지)
      exclude-path-prefixes:
        - /actuator
        - /demo/logs/
      # 로그 민감정보 마스킹(데모): payload/method 로그의 본문/인자/리턴에서 카드/주민번호를 마스킹.
      masking:
        enabled: true
    # --- 아래 3개는 라이브러리 기본 OFF. 데모에서 "요청 유입 시 전체 로깅 구간"을 눈으로 보려고 켠다.
    #     (docs/LOGGING_CASES.md). 실제 소비 서비스는 PII·비용을 고려해 선택적으로만 켠다. ---
    # 컨트롤러 입출력 본문 로깅(payload)
    payload-logging:
      enabled: true
      exclude-path-prefixes:
        - /actuator
        - /demo/logs/          # 뷰어 폴링 tail 은 본문 로깅도 제외
    # 컨트롤러 진입 인터셉트(controller.entry) — 뷰어 tail 컨트롤러(ai.mutuus.sample.logs)는 패키지 지정으로 자연 제외
    controller-entry:
      enabled: true
      packages:
        - ai.mutuus.sample.web
        - ai.mutuus.sample.demo
    # 메서드 인자/리턴 로깅(method.enter/exit, AOP) — 동일 패키지 타게팅(뷰어 제외). aspectj 필요.
    method-logging:
      enabled: true
      packages:
        - ai.mutuus.sample.web
        - ai.mutuus.sample.demo
    # 성공 응답 자동 래핑(데모: /demo/wrap). 라이브러리 기본 OFF.
    # exclude 를 명시하면 기본값을 대체하므로 springdoc/actuator/swagger 를 다시 나열하고,
    # 데모 UI(index.html)가 raw 배열을 기대하는 /demo/cases 인프라 엔드포인트도 제외한다.
    response-wrapper:
      enabled: true
      exclude-path-prefixes:
        - /actuator
        - /v3/api-docs
        - /swagger-ui
        - /demo/cases
    # 멱등성(Idempotency-Key) — 데모: 같은 키의 중복 POST 를 재처리 없이 첫 응답 재방.
    # 라이브러리 기본 OFF(opt-in). 헤더가 있는 대상 메서드(POST/PUT/PATCH) 요청에만 동작.
    idempotency:
      enabled: true
    # 캐시 추상화 — 데모: @EnableCaching + Redis CacheManager 컨벤션(TTL/키 프리픽스/JSON 직렬화).
    # 라이브러리 기본 OFF(opt-in). 실증엔 Redis 연결 필요(미가동 시 /demo/cache 는 안내만 반환).
    cache:
      enabled: true
      ttl: 5m
    # 분산 세션 컨벤션(세션 케이스): 네임스페이스/타임아웃
    session:
      namespace: sample-api:session
      timeout: 15m

# 환경 식별 마커. 프로파일별 application-<profile>.yml 이 이 값을 덮어쓴다.
demo:
  environment: local

server:
  port: ${SAMPLE_API_PORT:8090}

sample:
  ports:
    app: 8090
    test-range: 8095-8099
