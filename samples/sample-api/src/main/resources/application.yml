spring:
  application:
    name: sample-api
  security:
    oauth2:
      resourceserver:
        jwt:
          # 실제 인증 MSA의 JWK 엔드포인트. 샘플 실행용 placeholder(키 fetch는 lazy).
          # 통합 테스트는 이 값을 무시하고 mock JwtDecoder 빈으로 대체한다.
          jwk-set-uri: https://auth.mutuus.ai/realms/mutuus/protocol/openid-connect/certs
  data:
    redis:
      # Redis 는 세션 저장용으로만 쓴다(데모) — Redis 리포지토리 스캔을 꺼
      # JPA 리포지토리와의 store 판별 경고를 없앤다.
      repositories:
        enabled: false

# Redis 클라이언트가 classpath 에 있어도(세션 케이스용), Redis 가 없는 프로파일에서
# actuator health 가 DOWN 으로 뜨지 않게 health 기여자를 끈다. 실 Redis 연결은
# application-local.yml(로컬 인프라가 있는 환경)에서만 구성한다.
management:
  health:
    redis:
      enabled: false

# 테스트/데모 화면(/demo)은 sample-api 에 항상 포함된다 — 상세 로깅으로 라이브러리 동작을 관찰.
logging:
  level:
    ai.mutuus.common: DEBUG
    ai.mutuus.common.access: DEBUG

mutuus:
  common:
    service-name: sample-api
    default-locale: ko-KR
    # 어플리케이션코드(숫자/영문 4자리). 인스턴스구분코드(6자리)는 미지정 → 구동 시 자동 생성.
    app-code: SMPL
    security:
      permit-all:
        - /demo/**          # 테스트/데모 화면(항상 포함)
        - /api/public/**
        - /actuator/**
    logging:
      # 느린 요청 케이스가 잘 드러나도록 임계치를 낮춘다(기본 1000ms)
      slow-request-threshold-millis: 1000
      # 로그 뷰어(logs.html)가 1.5초마다 폴링하는 tail 경로는 로깅에서 제외(뷰어가 자기 폴링으로 도배 방지)
      exclude-path-prefixes:
        - /actuator
        - /demo/logs/
    # --- 아래 3개는 라이브러리 기본 OFF. 데모에서 "요청 유입 시 전체 로깅 구간"을 눈으로 보려고 켠다.
    #     (docs/LOGGING_CASES.md). 실제 소비 서비스는 PII·비용을 고려해 선택적으로만 켠다. ---
    # 컨트롤러 입출력 본문 로깅(payload)
    payload-logging:
      enabled: true
      exclude-path-prefixes:
        - /actuator
        - /demo/logs/          # 뷰어 폴링 tail 은 본문 로깅도 제외
    # 컨트롤러 진입 인터셉트(controller.entry) — 뷰어 tail 컨트롤러(ai.mutuus.sample.logs)는 패키지 지정으로 자연 제외
    controller-entry:
      enabled: true
      packages:
        - ai.mutuus.sample.web
        - ai.mutuus.sample.demo
    # 메서드 인자/리턴 로깅(method.enter/exit, AOP) — 동일 패키지 타게팅(뷰어 제외). aspectj 필요.
    method-logging:
      enabled: true
      packages:
        - ai.mutuus.sample.web
        - ai.mutuus.sample.demo
    # 분산 세션 컨벤션(세션 케이스): 네임스페이스/타임아웃
    session:
      namespace: sample-api:session
      timeout: 15m

# 환경 식별 마커. 프로파일별 application-<profile>.yml 이 이 값을 덮어쓴다.
demo:
  environment: local
