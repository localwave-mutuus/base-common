<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>게시판 CRUD — 3-스택(JPA/jOOQ/JDBC) 샘플</title>
  <style>
    body { font-family: system-ui, "Malgun Gothic", sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header { padding: 16px 24px; background: #1e293b; border-bottom: 1px solid #334155; }
    header h1 { margin: 0; font-size: 18px; }
    header p { margin: 6px 0 0; font-size: 13px; color: #94a3b8; }
    header a { color: #7dd3fc; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 16px; padding: 16px 24px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px 16px; }
    .card h2 { margin: 0 0 2px; font-size: 15px; }
    .jpa { color: #86efac; } .jooq { color: #fca5a5; } .jdbc { color: #93c5fd; }
    .card .desc { font-size: 12px; color: #94a3b8; margin-bottom: 10px; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
    input { background: #0f172a; border: 1px solid #475569; color: #e2e8f0; border-radius: 6px; padding: 5px 8px; font-size: 13px; }
    input.sm { width: 60px; } input.md { width: 120px; }
    button { background: #334155; color: #e2e8f0; border: 1px solid #475569; border-radius: 6px; padding: 5px 9px; font-size: 12px; cursor: pointer; }
    button:hover { background: #475569; }
    button.pri { background: #0ea5e9; border-color: #0ea5e9; color: #04263a; font-weight: 600; }
    button.warn { background: #b45309; border-color: #b45309; color: #fff; }
    pre { background: #020617; border: 1px solid #1e293b; border-radius: 6px; padding: 8px; font-size: 11.5px; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-all; margin: 6px 0 0; }
    .st { font-weight: 700; } .ok { color: #4ade80; } .bad { color: #f87171; }
    .tag { display:inline-block; font-size:10px; padding:1px 6px; border-radius:10px; background:#334155; color:#cbd5e1; margin-left:6px; }
  </style>
</head>
<body>
<header>
  <h1>게시판 CRUD — 3-스택 샘플 <span class="tag">실제 DB · 하나의 board_post 테이블</span></h1>
  <p>같은 <b>board_post</b> 테이블을 <b>JPA / jOOQ / Spring Data JDBC</b> 세 방식으로 각각 CRUD. 셋 다 <b>Record DTO + MapStruct + Bean Validation</b> 적용.
     &nbsp;|&nbsp; <a href="/demo/index.html">← 공통기능</a> <a href="/demo/db.html">🗄️ DB 랩</a></p>
</header>
<main id="main"></main>

<script>
  const STACKS = [
    { key: 'jpa',  name: 'Spring Data JPA (Hibernate)', cls: 'jpa',  desc: '@Entity + JpaRepository · 메서드명 파생 쿼리(by-author)' },
    { key: 'jooq', name: 'jOOQ',                         cls: 'jooq', desc: 'DSLContext 타입세이프 SQL · 복잡/PG특화 쿼리 강점' },
    { key: 'jdbc', name: 'Spring Data JDBC',             cls: 'jdbc', desc: '@Table + CrudRepository · "마법" 최소, 예측가능' },
  ];

  const main = document.getElementById('main');
  STACKS.forEach(s => {
    main.insertAdjacentHTML('beforeend', `
      <section class="card">
        <h2 class="${s.cls}">${s.name}</h2>
        <div class="desc">${s.desc} · 엔드포인트 <code>/demo/board/${s.key}</code></div>
        <div class="row">
          title <input id="${s.key}_title" class="md" value="첫 글"/>
          author <input id="${s.key}_author" class="md" value="alice"/>
        </div>
        <div class="row">
          content <input id="${s.key}_content" value="본문입니다"/>
          <button class="pri" onclick="create('${s.key}')">Create</button>
        </div>
        <div class="row">
          id <input id="${s.key}_id" class="sm" value="1"/>
          <button onclick="one('${s.key}','GET')">Get</button>
          <button onclick="one('${s.key}','PUT')">Update</button>
          <button onclick="one('${s.key}','DELETE')">Delete</button>
          <button onclick="listAll('${s.key}')">List</button>
          <button onclick="byAuthor('${s.key}')">By author</button>
        </div>
        <pre id="${s.key}_out">여기에 결과가 표시됩니다.</pre>
      </section>`);
  });

  function v(id){ return document.getElementById(id).value; }
  function body(k){ return { title: v(k+'_title'), content: v(k+'_content'), author: v(k+'_author') }; }
  async function call(method, url, payload, k){
    const el = document.getElementById(k + '_out');
    const opt = { method, headers: { 'Content-Type': 'application/json' } };
    if (payload !== null) opt.body = JSON.stringify(payload);
    try {
      const res = await fetch(url, opt);
      let json; try { json = await res.json(); } catch(e){ json = '(no json)'; }
      el.innerHTML = `<span class="st ${res.ok?'ok':'bad'}">HTTP ${res.status}</span> ${method} ${url}\n` + JSON.stringify(json, null, 2);
    } catch(e){ el.innerHTML = `<span class="st bad">ERROR</span> ${e}`; }
  }
  const base = k => `/demo/board/${k}`;
  function create(k){ call('POST', base(k), body(k), k); }
  function listAll(k){ call('GET', base(k), null, k); }
  function byAuthor(k){ call('GET', base(k)+'/by-author?author='+encodeURIComponent(v(k+'_author')), null, k); }
  function one(k, method){
    const url = base(k) + '/' + v(k+'_id');
    call(method, url, method==='PUT' ? body(k) : null, k);
  }
</script>
</body>
</html>
