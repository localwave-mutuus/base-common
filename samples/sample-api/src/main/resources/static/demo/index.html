<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>common-platform 공통기능 데모</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; background: #0f1115; color: #e6e6e6; }
    header { padding: 16px 24px; background: #161a22; border-bottom: 1px solid #2a2f3a; }
    header h1 { margin: 0; font-size: 18px; }
    header p { margin: 4px 0 0; color: #8b94a7; font-size: 13px; }
    .wrap { display: flex; gap: 16px; padding: 16px 24px; align-items: flex-start; }
    .cases { flex: 0 0 420px; }
    .case { background: #161a22; border: 1px solid #2a2f3a; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
    .case h3 { margin: 0 0 4px; font-size: 14px; }
    .meth { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-right: 6px; }
    .GET { background: #1d3a2a; color: #6ee7a8; }
    .POST { background: #3a2a1d; color: #f0b06e; }
    .path { color: #8b94a7; font-size: 12px; font-family: ui-monospace, monospace; }
    .observe { color: #aab2c5; font-size: 12px; margin: 6px 0; }
    .bp { color: #6b7280; font-size: 11px; }
    .bp code { color: #c39bf0; font-size: 11px; font-family: ui-monospace, monospace; }
    .badge { font-size: 11px; font-weight: 700; margin-left: 6px; }
    .pass { color: #6ee7a8; } .fail { color: #f06e6e; }
    .exp { color: #6b7280; font-size: 11px; }
    .runall { background: #1d3a2a; color: #6ee7a8; }
    .runall:hover { background: #245036; }
    button { background: #2b6cf0; color: white; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
    button:hover { background: #3a78ff; }
    .out { flex: 1; position: sticky; top: 16px; }
    pre { background: #11141b; border: 1px solid #2a2f3a; border-radius: 8px; padding: 14px; overflow: auto; max-height: 80vh; font-size: 12px; line-height: 1.5; }
    .status { font-weight: 700; }
    .s2 { color: #6ee7a8; } .s4 { color: #f0b06e; } .s5 { color: #f06e6e; }
    label { font-size: 12px; color: #8b94a7; margin-right: 8px; }
    input { background: #11141b; border: 1px solid #2a2f3a; color: #e6e6e6; border-radius: 6px; padding: 4px 8px; }
  </style>
</head>
<body>
  <header>
    <h1>common-platform 공통기능 데모</h1>
    <p>케이스를 골라 실행 → 응답·헤더·서버 로그 관찰. 라이브러리 코드(브레이크포인트)에 F5 디버그로 멈춰 단계별 확인.</p>
    <p style="margin-top:8px">
      <label>X-Locale</label><input id="locale" placeholder="(빈값=기본)" size="8">
      <label style="margin-left:16px">X-Screen-Id</label><input id="screen" placeholder="(선택)" size="10">
      <label style="margin-left:16px">X-User-Id</label><input id="user" placeholder="(감사 주체)" size="10">
      <label style="margin-left:16px">Bearer</label><input id="bearer" placeholder="(예: alice)" size="10">
      <button class="runall" style="margin-left:16px" onclick="runAll()">▶ 전체 실행 (16)</button>
      <a href="/demo/logs.html" style="margin-left:16px; color:#6ea8ff; font-size:13px">📜 로그 뷰어 →</a>
    </p>
  </header>
  <div class="wrap">
    <div class="cases" id="cases">불러오는 중…</div>
    <div class="out">
      <pre id="output">← 왼쪽에서 케이스를 선택해 실행하세요.</pre>
    </div>
  </div>

  <script>
    const out = document.getElementById('output');
    let CASES = [];

    function headers(c) {
      const h = { 'Accept': 'application/json' };
      const loc = document.getElementById('locale').value.trim();
      const scr = document.getElementById('screen').value.trim();
      const usr = document.getElementById('user').value.trim();
      const bea = document.getElementById('bearer').value.trim();
      if (loc) h['X-Locale'] = loc;
      if (scr) h['X-Screen-Id'] = scr;
      if (usr) h['X-User-Id'] = usr;
      // 인증 모드: none=미전송, fixed=데모토큰(상단 입력 우선), 그 외=상단 입력값만
      if (c && c.authMode === 'none') { /* 인증 미전송 */ }
      else if (c && c.authMode === 'fixed') { h['Authorization'] = 'Bearer ' + (bea || 'demo-user'); }
      else if (bea) { h['Authorization'] = 'Bearer ' + bea; }
      return h;
    }

    function setBadge(c, pass, status) {
      const b = document.getElementById('badge-' + c.id);
      if (b) { b.textContent = (pass ? '✅ ' : '❌ ') + status; b.className = 'badge ' + (pass ? 'pass' : 'fail'); }
    }

    async function run(c, silent) {
      if (!silent) out.textContent = `→ ${c.method} ${c.path} 호출 중…`;
      const opt = { method: c.method, headers: headers(c) };
      if (c.method === 'POST') { opt.headers['Content-Type'] = 'application/json'; opt.body = c.sampleBody || '{}'; }
      try {
        const res = await fetch(c.path, opt);
        const pass = res.status === c.expectStatus;
        setBadge(c, pass, res.status);
        if (!silent) {
          const traceId = res.headers.get('X-Trace-Id');
          const appCode = res.headers.get('X-App-Code');
          const instId = res.headers.get('X-Instance-Id');
          let body; const txt = await res.text();
          try { body = JSON.stringify(JSON.parse(txt), null, 2); } catch { body = txt; }
          out.innerHTML =
            `<span class="status ${pass ? 's2' : 's5'}">${pass ? '✅ PASS' : '❌ FAIL'}  HTTP ${res.status}</span>  (기대 ${c.expectStatus})   X-Trace-Id: ${traceId || '(없음)'}\n` +
            `X-App-Code: ${appCode || '(없음)'}   X-Instance-Id: ${instId || '(없음)'}\n` +
            `요청: ${c.method} ${c.path}\n\n${escapeHtml(body)}`;
        }
        return { pass, status: res.status };
      } catch (e) {
        setBadge(c, false, 'ERR');
        if (!silent) out.textContent = '요청 실패: ' + e;
        return { pass: false, status: 'ERR' };
      }
    }

    async function runAll() {
      out.textContent = '전체 실행 중…';
      let passed = 0; const fails = [];
      for (const c of CASES) {
        const r = await run(c, true);
        if (r.pass) passed++; else fails.push(`${c.id} → ${r.status} (기대 ${c.expectStatus})`);
      }
      const allPass = passed === CASES.length;
      out.innerHTML =
        `<span class="status ${allPass ? 's2' : 's5'}">${allPass ? '✅ 전체 통과' : '❌ 일부 실패'}  ${passed}/${CASES.length}</span>\n\n` +
        (fails.length ? '실패:\n' + escapeHtml(fails.join('\n')) : '모든 케이스가 기대 상태로 응답했습니다.');
    }

    function escapeHtml(s) { return String(s).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }

    fetch('/demo/cases', { headers: { 'Accept': 'application/json' } })
      .then(r => r.json())
      .then(cases => {
        CASES = cases;
        const box = document.getElementById('cases');
        box.innerHTML = '';
        cases.forEach(c => {
          const el = document.createElement('div');
          el.className = 'case';
          el.innerHTML =
            `<h3><span class="meth ${c.method}">${c.method}</span>${c.title} <span class="badge" id="badge-${c.id}"></span></h3>` +
            `<div class="path">${c.path}${c.sampleBody ? '  body=' + escapeHtml(c.sampleBody) : ''}  <span class="exp">기대 ${c.expectStatus}</span></div>` +
            `<div class="observe">${c.observe}</div>` +
            `<div class="bp">brk: <code>${c.breakpoint}</code></div>` +
            `<div style="margin-top:8px"><button>실행</button></div>`;
          el.querySelector('button').onclick = () => run(c, false);
          box.appendChild(el);
        });
      })
      .catch(e => { document.getElementById('cases').textContent = '케이스 목록 로드 실패: ' + e; });
  </script>
</body>
</html>
