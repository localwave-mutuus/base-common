# 암호화 시크릿 로더 실증 전용 프로파일.
#
# 실제 암호문·개인키·키 저장소 비밀번호는 이 파일에 두지 않는다. Golmok DB의 URL/사용자 계약은
# 유지하고 비밀번호 전달 방식만 common-platform v2 inline 로더로 교체한다. 이 프로파일은 스키마를
# 변경하지 않는 연결 검증용이므로 Flyway와 Hibernate DDL을 끄고 Hikari를 read-only로 연다.
spring:
  datasource:
    url: ${GOLMOK_DB_URL}
    username: ${GOLMOK_DB_USER}
    password: ${GOLMOK_DB_PASSWORD_TOKEN}
    hikari:
      read-only: true
      maximum-pool-size: 2
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none

mutuus:
  common:
    secret:
      enabled: true
      environment: local
      keystore: ${SAMPLE_SECRET_KEYSTORE}
      keystore-password-file: ${SAMPLE_SECRET_KEYSTORE_PASSWORD_FILE}
      allowed-key-ids: ${SAMPLE_SECRET_ALLOWED_KEY_IDS:}
