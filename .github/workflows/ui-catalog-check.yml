name: UI 카탈로그 검사
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 정본 구조와 커밋된 생성물 검사
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/ui-catalog/generate.py --check
