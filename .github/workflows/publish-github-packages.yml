name: Publish Maven packages to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      verify_published_only:
        description: '이미 게시된 패키지의 지정 영향 시험만 확인(재게시 안 함)'
        type: boolean
        default: false
      verification_scope:
        description: 'consumer-only 영향 시험 범위'
        type: choice
        options:
          - ecs-response
          - redis
        default: ecs-response

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java and Maven settings
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Verify the reactor before publication
        if: ${{ inputs.verify_published_only != true }}
        run: bash ./mvnw -B clean verify

      - name: Publish verified reactor artifacts
        if: ${{ inputs.verify_published_only != true }}
        run: bash ./mvnw -B -Pgithub -DskipTests deploy
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify sample-api consumes the published package
        if: ${{ inputs.verify_published_only != true }}
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf "$RUNNER_TEMP/m2-consumer"
          bash ./mvnw -B -f samples/sample-api/pom.xml -Pgithub-consumer \
            -Dmaven.repo.local="$RUNNER_TEMP/m2-consumer" clean test

      - name: Recheck failed published response event assertion
        if: ${{ inputs.verify_published_only == true && inputs.verification_scope != 'redis' }}
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          bash ./mvnw -B -f samples/sample-api/pom.xml -Pgithub-consumer
          -Dmaven.repo.local="$RUNNER_TEMP/m2-consumer"
          '-Dtest=EcsLoggingIntegrationTest#access_completed*' clean test

      - name: Verify Redis cache and session lifecycle once against published artifacts
        if: ${{ inputs.verify_published_only == true && inputs.verification_scope == 'redis' }}
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash ./mvnw -B -f samples/sample-api/pom.xml -Pgithub-consumer \
            -Dmaven.repo.local="$RUNNER_TEMP/m2-consumer" \
            '-Dtest=RedisCacheIntegrationTest,RedisSessionIntegrationTest' clean test
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ("RedisCacheIntegrationTest", "RedisSessionIntegrationTest"):
              report = ET.parse(Path("samples/sample-api/target/surefire-reports") / f"TEST-ai.mutuus.sample.{name}.xml").getroot()
              assert int(report.get("tests", 0)) == 1, name
              assert all(int(report.get(k, 0)) == 0 for k in ("skipped", "errors", "failures")), name
          PY
