name: Publish Maven packages to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      verify_published_only:
        description: '이미 게시된 패키지의 지정 영향 시험만 확인(재게시 안 함)'
        type: boolean
        default: false
      verification_scope:
        description: 'consumer-only 영향 시험 범위'
        type: choice
        options:
          - ecs-response
          - redis
          - redis-cache
        default: ecs-response

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java and Maven settings
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Verify the reactor before publication
        if: ${{ inputs.verify_published_only != true }}
        run: |
          # DEV release candidates use the approved bounded contract suite. Stable releases retain full verification.
          if [[ "$GITHUB_REF_NAME" == v0.6.0 || "$GITHUB_REF_NAME" == v0.6.1 || "$GITHUB_REF_NAME" == v0.6.4 ]]; then
            bash ./mvnw -B -pl parent,bom,lib,agent-extension,starters/starter-web,starters/starter-batch -am -DskipTests package
          elif [[ "$GITHUB_REF_NAME" == v0.4.0-rc.* ]]; then
            bash ./mvnw -B '-Dtest=Otel*ContractTest,TraceContextTest,TraceHeadersTest,TraceFilterTest,TraceContextPropagationTest,CommonAsyncAutoConfigurationTest,CommonSecurityAutoConfigurationTest,SecurityPropagationBlockIntegrationTest,HeaderPropagationInterceptorTest,BatchLoggingNonTransitivityTest,ActionLoggingNonWebTest' \
              -Dsurefire.failIfNoSpecifiedTests=false clean verify
          else
            bash ./mvnw -B clean verify
          fi

      - name: Publish verified reactor artifacts
        if: ${{ inputs.verify_published_only != true }}
        run: |
          if [[ "$GITHUB_REF_NAME" == v0.6.0 || "$GITHUB_REF_NAME" == v0.6.1 || "$GITHUB_REF_NAME" == v0.6.4 ]]; then
            bash ./mvnw -B -Pgithub -pl parent,bom,lib,agent-extension,starters/starter-web,starters/starter-batch -am -DskipTests deploy
          else
            bash ./mvnw -B -Pgithub -DskipTests deploy
          fi
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify sample-api consumes the published package
        if: ${{ inputs.verify_published_only != true }}
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf "$RUNNER_TEMP/m2-consumer"
          if [[ "$GITHUB_REF_NAME" == v0.6.0 || "$GITHUB_REF_NAME" == v0.6.1 || "$GITHUB_REF_NAME" == v0.6.4 ]]; then
            bash ./mvnw -B -f samples/sample-api/pom.xml -Pgithub-consumer \
              -Dmaven.repo.local="$RUNNER_TEMP/m2-consumer" '-Dtest=OtelRegistryGenerationContractTest' clean test
          elif [[ "$GITHUB_REF_NAME" == v0.4.0-rc.* ]]; then
            bash ./mvnw -B -f samples/sample-api/pom.xml -Pgithub-consumer \
              -Dmaven.repo.local="$RUNNER_TEMP/m2-consumer" '-Dtest=Otel*ContractTest' clean test
          else
            bash ./mvnw -B -f samples/sample-api/pom.xml -Pgithub-consumer \
              -Dmaven.repo.local="$RUNNER_TEMP/m2-consumer" clean test
          fi

      - name: Recheck failed published response event assertion
        if: ${{ inputs.verify_published_only == true && inputs.verification_scope == 'ecs-response' }}
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          bash ./mvnw -B -f samples/sample-api/pom.xml -Pgithub-consumer
          -Dmaven.repo.local="$RUNNER_TEMP/m2-consumer"
          '-Dtest=EcsLoggingIntegrationTest#access_completed*' clean test

      - name: Verify Redis cache and session lifecycle once against published artifacts
        if: ${{ inputs.verify_published_only == true && (inputs.verification_scope == 'redis' || inputs.verification_scope == 'redis-cache') }}
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          VERIFICATION_SCOPE: ${{ inputs.verification_scope }}
        run: |
          tests=RedisCacheIntegrationTest
          if [ "$VERIFICATION_SCOPE" = redis ]; then tests="$tests,RedisSessionIntegrationTest"; fi
          bash ./mvnw -B -f samples/sample-api/pom.xml -Pgithub-consumer \
            -Dmaven.repo.local="$RUNNER_TEMP/m2-consumer" \
            "-Dtest=$tests" clean test
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import os
          names = ["RedisCacheIntegrationTest"]
          if os.environ["VERIFICATION_SCOPE"] == "redis":
              names.append("RedisSessionIntegrationTest")
          for name in names:
              report = ET.parse(Path("samples/sample-api/target/surefire-reports") / f"TEST-ai.mutuus.sample.{name}.xml").getroot()
              assert int(report.get("tests", 0)) == 1, name
              assert all(int(report.get(k, 0)) == 0 for k in ("skipped", "errors", "failures")), name
          PY
