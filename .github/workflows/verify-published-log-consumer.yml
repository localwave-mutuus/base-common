name: Verify published logging consumer
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Recheck failed response event assertion against immutable 0.2.5
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          bash ./mvnw -B -f samples/sample-api/pom.xml -Pgithub-consumer
          -Dmaven.repo.local="$RUNNER_TEMP/m2-consumer"
          '-Dtest=EcsLoggingIntegrationTest#access_completed*' clean test
